<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tip Calculator</h2>
    <form id="tipForm">
        <label for="billValue">Bill Amount:</label>
        <input type="number" id="billValue" placeholder="Enter bill amount" required>

        <label for="tipPercentage">Tip Percentage (%):</label>
        <input type="number" id="tipPercentage" placeholder="Enter tip percentage" required>

        <button type="button" onclick="calculateTip()">Calculate Tip</button>
    </form>

    <div class="result" id="result">
        <!-- Result will be displayed here -->
    </div>
</div>

<script>
    function calculateTip() {
        // Get user input values
        let billValue = parseFloat(document.getElementById("billValue").value);
        let tipPercentage = parseFloat(document.getElementById("tipPercentage").value);

        // Validate inputs
        if (isNaN(billValue) || isNaN(tipPercentage) || billValue <= 0 || tipPercentage <= 0) {
            alert("Please enter valid values for both bill amount and tip percentage.");
            return;
        }

        // Calculate tip and total amount
        let tipAmount = (billValue * tipPercentage) / 100;
        let totalAmount = billValue + tipAmount;

        // Display the result
        document.getElementById("result").innerHTML = `
            <p><strong>Tip Amount:</strong> ${tipAmount.toFixed(2)}</p>
            <p><strong>Total Amount (with tip):</strong> ${totalAmount.toFixed(2)}</p>
        `;
    }
</script>

</body>
</html>
